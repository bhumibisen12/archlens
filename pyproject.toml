[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "archlens"
version = "0.1.0"
description = "Local, privacy-first computer vision tool for parsing software architecture diagrams into directed graphs and running rule-based design checks."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "opencv-python>=4.8,<5",
    "numpy>=1.24",
    "scikit-image>=0.22",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "streamlit>=1.30",
    "pytest>=8.0",
    "pytesseract>=0.3.10",
]

[project.optional-dependencies]
paddle = [
    "paddleocr>=2.7",
    "paddlepaddle>=2.6",
]
dev = [
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

