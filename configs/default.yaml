# Default ArchLens pipeline configuration

logging:
  level: INFO

preprocess:
  max_dimension: 2048
  enable_perspective_correction: true
  paper_min_area_ratio: 0.45
  paper_canny_low: 50
  paper_canny_high: 150
  paper_approx_epsilon: 0.02
  enable_shadow_removal: true
  shadow_kernel_size: 51
  denoise_method: median
  denoise_kernel: 3
  adaptive_block_size: 31
  adaptive_c: 10
  binary_invert: true

detect:
  min_component_area: 1200
  max_component_area_ratio: 0.45
  min_width: 32
  min_height: 24
  max_aspect_ratio: 6.0
  min_solidity: 0.65
  min_extent: 0.45
  min_interior_radius: 8.0
  morph_close_kernel: 3
  polygon_epsilon_ratio: 0.03
  rect_min_extent: 0.72
  ellipse_max_residual: 0.18
  nested_containment_threshold: 0.8

ocr:
  engine: tesseract
  language: eng
  min_confidence: 0.4
  tesseract_psm: 11
  paddle_model_dir: null
  char_replacements:
    "|": "I"
    "—": "-"
    "–": "-"
    "‘": "'"
    "’": "'"
    "“": '"'
    "”": '"'
  token_replacements:
    AP1: API
    D8: DB
    R3dis: Redis
  inside_margin_px: 6
  max_edge_distance_px: 80.0

connectors:
  snap_distance_px: 35
  node_mask_dilation_px: 4
  text_mask_dilation_px: 2
  spur_prune_length_px: 14
  min_polyline_length_px: 18.0
  simplify_epsilon_px: 3.0
  max_crossing_angle_deg: 35.0
  arrowhead_probe_length_px: 22
  arrowhead_probe_half_width_px: 12
  arrowhead_dominance_ratio: 1.3
  min_arrowhead_ink_pixels: 35

review:
  enable_cycle_check: true
  enable_orphan_check: true
  enable_unlabeled_check: true
  require_queue_between_services: true
  max_fan_in: 5
  max_fan_out: 5
  roles_config_path: null

export:
  indent: 2

